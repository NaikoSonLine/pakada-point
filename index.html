<title>PAKADA · accès réservé</title>
<style>
:root{--bg:#f3f2ee;--surf:#fcfcfb;--ink:#0b0b0b;--mut:#6b6a65;--line:#dcdad2;--acc:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--surf:#1a1a19;--ink:#fff;--mut:#a3a298;--line:#2c2c2a;--acc:#3987e5}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.box{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:26px 22px}
h1{font-size:22px;margin:10px 0 4px}p{color:var(--mut);margin:0 0 18px;font-size:15px}
input[type=password]{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{width:100%;margin-top:12px;font:inherit;font-weight:650;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6}
label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--mut)}
#err{color:#e34948;font-size:14px;min-height:20px;margin-top:10px}
</style></head><body>
